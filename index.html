<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polígono con geolocalización</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>Mi polígono</h1>
    <div class="controles">
      <button id="btnUbicar" type="button">Mi ubicación</button>
      <button id="btnAgregarAqui" type="button">Agregar vértice aquí</button>
      <button id="btnCerrar" type="button" disabled>Cerrar polígono</button>
      <button id="btnDeshacer" type="button" disabled>Deshacer punto</button>
      <button id="btnLimpiar" type="button">Limpiar</button>
      <button id="btnExportar" type="button" disabled>Exportar GeoJSON</button>
      <button id="btnDentroFuera" type="button">¿Estoy dentro?</button>
      <button id="btnGeocerca" type="button">Iniciar geocerca</button>
      <label class="etiquetaColor">Color:
        <input type="color" id="colorPoligono" value="#27ae60">
      </label>
      <input type="text" id="nombrePoligono" placeholder="Nombre del polígono">
      <label class="etiquetaArchivo">Importar GeoJSON:
        <input type="file" id="archivoGeoJSON" accept=".geojson,application/geo+json,application/json">
      </label>
    </div>
    <p id="info">Haz clic en el mapa para agregar vértices.</p>
  </header>
  <div id="panelVertices">
    <table id="tablaVertices">
      <thead>
        <tr>
          <th>#</th>
          <th>Latitud</th>
          <th>Longitud</th>
        </tr>
      </thead>
      <tbody id="cuerpoTablaVertices"></tbody>
    </table>
  </div>
  <div id="mapa"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
